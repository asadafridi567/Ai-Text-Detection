      - ./Backend/.env
    depends_on:
      - ai
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_MvNSLluP4A2G@ep-jolly-frog-aedai68u-pooler.c-2.us-east-2.aws.neon.tech/neondb
    restart: unless-stopped

  ai:
    build: ./AI
    env_file:
      - ./AI/.env
    ports:
      - "5000:5000"
    restart: unless-stopped